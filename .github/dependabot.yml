# Mises à jour automatiques des dépendances (Dependabot).
# Les correctifs de sécurité arrivent dès qu'une faille est publiée ;
# les autres mises à jour sont regroupées en une PR par mois.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Indian/Reunion
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
